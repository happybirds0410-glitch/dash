name: Build Gemini contract chatbot

on:
  push:
    paths:
      - '.chatbot_parts/**'
      - '.github/workflows/build-chatbot.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble chatbot index.html
        shell: bash
        run: |
          test -f .chatbot_parts/part00.txt
          test -f .chatbot_parts/part01.txt
          test -f .chatbot_parts/rest.txt
          cat .chatbot_parts/part00.txt .chatbot_parts/part01.txt .chatbot_parts/rest.txt | base64 -d > chatbot.html.gz
          gzip -dc chatbot.html.gz > index.html
          rm chatbot.html.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Build Gemini contract guideline chatbot'
          git push
