name: Build Gemini contract chatbot

on:
  push:
    paths:
      - '.chatbot_parts/**'
      - '.github/workflows/build-chatbot.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble chatbot index.html
        shell: bash
        run: |
          count=$(find .chatbot_parts -maxdepth 1 -type f -name 'part??.txt' | wc -l)
          test "$count" -eq 10
          cat .chatbot_parts/part00.txt .chatbot_parts/part01.txt .chatbot_parts/part02.txt .chatbot_parts/part03.txt .chatbot_parts/part04.txt .chatbot_parts/part05.txt .chatbot_parts/part06.txt .chatbot_parts/part07.txt .chatbot_parts/part08.txt .chatbot_parts/part09.txt | base64 -d > chatbot.html.gz
          gzip -dc chatbot.html.gz > index.html
          rm chatbot.html.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Build Gemini contract guideline chatbot'
          git push
